
<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paúl Pérez | Terminal Portfolio</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Fira+Code:wght@400;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#22c55e",
                        "background-dark": "#121212",
                        "terminal-header": "#1e1e1e",
                        "terminal-body": "#0a0a0a",
                        "terminal-sidebar": "#141414",
                    },
                    fontFamily: {
                        display: ["JetBrains Mono", "monospace"],
                        mono: ["Fira Code", "monospace"],
                    },
                },
            },
        };
    </script>
    <style type="text/tailwindcss">
        @layer base {
            body {
                @apply bg-background-dark font-mono text-gray-300 selection:bg-primary selection:text-black antialiased overflow-hidden;
            }
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #141414;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #22c55e;
        }
        .cursor {
            display: inline-block;
            width: 10px;
            height: 20px;
            background-color: #22c55e;
            vertical-align: middle;
            margin-left: 4px;
            animation: blink 1s step-end infinite;
        }
        @keyframes blink {
            from, to { opacity: 1; }
            50% { opacity: 0; }
        }
        .terminal-window {
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            border: 1px solid #333;
        }
        
        /* Efecto de texto 3D según la imagen del usuario */
        .terminal-depth-text {
            color: #22c55e;
            font-family: 'JetBrains Mono', monospace;
            text-transform: uppercase;
            letter-spacing: -0.05em;
            line-height: 0.8;
            text-shadow: 
                2px 2px 0px #0a0a0a,
                4px 4px 0px #22c55e,
                6px 6px 0px #0a0a0a,
                8px 8px 0px #22c55e;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
