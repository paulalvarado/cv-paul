    <style type="text/tailwindcss">
        @layer base {
            body {

        .custom-scrollbar::-webkit-scrollbar {

        .cursor {

            background-color: #22c55e;
            vertical-align: middle;
            margin-left: 4px;
            animation: blink 1s step-end infinite;

        @keyframes blink {
            from, to { opacity: 1; }

        }
        .terminal-window {

        /* Efecto de texto 3D según la imagen del usuario */
